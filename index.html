<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Bayar per Hitung</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; color: #fff; margin: 0; }
    .calculator { background: #1e293b; padding: 24px; border-radius: 16px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .display { width: 100%; height: 50px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #38bdf8; text-align: right; padding: 10px; font-size: 1.5rem; margin-bottom: 16px; outline: none; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { padding: 16px; font-size: 1.2rem; border: none; border-radius: 8px; background: #334155; color: #fff; cursor: pointer; transition: 0.2s; }
    button:hover { background: #475569; }
    button.op { background: #0284c7; }
    button.op:hover { background: #0369a1; }
    button.equal { background: #16a34a; grid-column: span 2; }
    button.equal:hover { background: #15803d; }
    button.clear { background: #dc2626; grid-column: span 2; }
    button.clear:hover { background: #b91c1c; }
    
    /* Modal Pembayaran */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal { background: #1e293b; padding: 24px; border-radius: 12px; text-align: center; max-width: 300px; border: 1px solid #0284c7; }
    .modal h3 { margin-top: 0; color: #f43f5e; }
    .pay-btn { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 12px; width: 100%; font-weight: bold; }
  </style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" class="display" readonly placeholder="0">
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="op" onclick="appendOp('/')">÷</button>
    <button class="op" onclick="appendOp('*')">×</button>
    
    <button onclick="appendNum('7')">7</button>
    <button onclick="appendNum('8')">8</button>
    <button onclick="appendNum('9')">9</button>
    <button class="op" onclick="appendOp('-')">-</button>
    
    <button onclick="appendNum('4')">4</button>
    <button onclick="appendNum('5')">5</button>
    <button onclick="appendNum('6')">6</button>
    <button class="op" onclick="appendOp('+')">+</button>
    
    <button onclick="appendNum('1')">1</button>
    <button onclick="appendNum('2')">2</button>
    <button onclick="appendNum('3')">3</button>
    <button class="equal" onclick="calculate()">=</button>
    
    <button onclick="appendNum('0')" style="grid-column: span 2;">0</button>
  </div>
</div>

<!-- Modal Pop-up Paywall -->
<div class="modal-overlay" id="payModal">
  <div class="modal">
    <h3>Quota Perhitungan Habis!</h3>
    <p>Biaya perhitungan berikutnya: <b>Rp15.000</b></p>
    <p style="font-size: 0.85rem; color: #94a3b8;">
      Bayar via DANA: 
      <a href="https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012092026090425377151" target="_blank" style="color: #38bdf8; text-decoration: underline;">
        Klik di sini untuk Bayar via DANA
      </a>
    </p>
    <button class="pay-btn" onclick="simulasiBayar()">Saya Sudah Bayar (Konfirmasi)</button>
  </div>
</div>

<script>
  let isPaid = true; // Perhitungan pertama gratis
  let display = document.getElementById('display');

  function appendNum(num) {
    display.value += num;
  }

  function appendOp(op) {
    if (display.value !== '') {
      display.value += ' ' + op + ' ';
    }
  }

  function clearDisplay() {
    display.value = '';
  }

  function calculate() {
    if (!isPaid) {
      document.getElementById('payModal').style.display = 'flex';
      return;
    }

    try {
      if (display.value.trim() !== '') {
        display.value = eval(display.value.replace(/×/g, '*').replace(/÷/g, '/'));
        isPaid = false; // Kunci perhitungan untuk penggunaan selanjutnya
      }
    } catch (e) {
      display.value = 'Error';
    }
  }

  function simulasiBayar() {
    alert("Pembayaran Rp15.000 berhasil dikonfirmasi! Kamu dapat 1x kesempatan menghitung lagi.");
    isPaid = true;
    document.getElementById('payModal').style.display = 'none';
    clearDisplay();
  }
</script>

</body>
</html>
